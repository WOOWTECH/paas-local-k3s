apiVersion: v1
kind: Pod
metadata: {name: cs-migrate-src, namespace: paas-test-code-server, labels: {woow.paas/lab-migrate: code-server}}
spec:
  restartPolicy: Never
  imagePullSecrets: [{name: paas-registry}]
  securityContext: {runAsUser: 0, runAsGroup: 0}
  containers:
    - name: src
      image: jcr-prod.woowtech.io/woow-paas-docker-local/code-server:20261110.1622@sha256:0271957892a382d88c141c4a0d3a2b3b53da6cd0b56ba7239fe229608d6dcb5b
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 512Mi}}
      volumeMounts:
        - {name: pidata, mountPath: /pvc, readOnly: true}
        - {name: scripts, mountPath: /scripts}
  volumes:
    - {name: pidata, persistentVolumeClaim: {claimName: code-server-codex-pi-data, readOnly: true}}
    - {name: scripts, configMap: {name: lab-migrate-scripts}}
