# lab tunnel connector — chart：paas-app-bundle-cd/cloudflare-ha/chart（vendored cloudflare-tunnel-remote 0.1.2-woow.1）
# 安裝到 ns paas-stg-cloudflare-system（operator paasEnv=stg 推導的 cloudflared ns；租戶 baseline NP 的 allow-cloudflared 看這個 ns）
# tunnel token 不進 git：--set cloudflare.tunnel_token=$(...) 或 existing secret
image:
  tag: "2026.7.3"
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
readinessProbe:
  enabled: true
pdb:
  enabled: false
# lab：connector 不可排到 TUF（該節點 pod 網路不通，排上去整個 lab 對外就斷）或筆電
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [woowtechcluster1-aorus-15p-xd, woowtech-ai-coder-asus-tuf-gaming-f15-fx507zu4-fx507zu4]
