worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=odoo_assets:10m max_size=200m inactive=7d;
    upstream odoo_backend { server 127.0.0.1:8069; }
    upstream odoo_longpolling { server 127.0.0.1:8072; }
    server {
        listen 8080;
        server_name _;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        location /web/assets/ {
            proxy_pass http://odoo_backend;
            proxy_cache odoo_assets;
            proxy_cache_valid 200 7d;
            add_header X-Cache-Status $upstream_cache_status;
            expires 7d;
        }
        location /web/static/ {
            proxy_pass http://odoo_backend;
            proxy_cache odoo_assets;
            proxy_cache_valid 200 7d;
            expires 7d;
        }
        location /websocket {
            proxy_pass http://odoo_longpolling;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        location / {
            proxy_pass http://odoo_backend;
            proxy_read_timeout 720s;
            proxy_connect_timeout 720s;
            proxy_send_timeout 720s;
        }
    }
}
