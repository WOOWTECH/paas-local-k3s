{{- if .Values.fcm.woow.enabled }}
# The PaaS baseline egress only allows the namespace itself, DNS and public addresses; the woow
# sidecar must also reach the in-cluster fcm-central (whitelist 8000, token vending 8001).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opt.fullname" . }}-fcm-central-egress
  labels:
    {{- include "opt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.fcm.woow.centralNamespace }}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8001}
{{- end }}
{{- if .Values.tunnel.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opt.fullname" . }}-tunnel
  labels:
    {{- include "opt.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tunnel
  template:
    metadata:
      labels:
        {{- include "opt.labels" . | nindent 8 }}
        app.kubernetes.io/component: tunnel
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: {{ .Values.tunnel.image }}
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ required "tunnel.secretName is required" .Values.tunnel.secretName }}, key: TUNNEL_TOKEN}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.tunnel.resources | nindent 12 }}
{{- end }}
