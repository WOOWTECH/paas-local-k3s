{{- /* Passwords are generated on first install and read back with lookup on every upgrade, so the
       running database keeps its password. They never pass through the platform's helm_values. */ -}}
{{- $name := include "opt.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pg := randAlphaNum 32 -}}
{{- $admin := randAlphaNum 32 -}}
{{- if and $existing $existing.data -}}
{{- $pg = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- $admin = index $existing.data "ODOO_ADMIN_PASSWD" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opt.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.odoo.dbName | quote }}
  POSTGRES_USER: {{ .Values.odoo.dbUser | quote }}
  POSTGRES_PASSWORD: {{ $pg | quote }}
  ODOO_ADMIN_PASSWD: {{ $admin | quote }}
  odoo.conf: |
    [options]
    addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    data_dir = /var/lib/odoo
    admin_passwd = {{ $admin }}
    db_name = {{ .Values.odoo.dbName }}
    db_filter = ^{{ .Values.odoo.dbName }}$
    db_maxconn = 64
    db_template = template1
    http_port = 8069
    gevent_port = 8072
    proxy_mode = True
    server_wide_modules = base,web
    workers = {{ .Values.odoo.workers }}
    max_cron_threads = {{ .Values.odoo.maxCronThreads }}
    limit_memory_hard = {{ .Values.odoo.limitMemoryHard | int64 }}
    limit_memory_soft = {{ .Values.odoo.limitMemorySoft | int64 }}
    limit_time_cpu = {{ .Values.odoo.limitTimeCpu }}
    limit_time_real = {{ .Values.odoo.limitTimeReal }}
    limit_request = 8192
    log_level = info
    logfile = False
    without_demo = all
    list_db = {{ ternary "True" "False" .Values.odoo.listDb }}
