# operator 認的目標：http://paas-suspended-page.<cloudflared ns>.svc.cluster.local:8080
# ⛔ 名稱與 port 不可改（paas-operator SUSPENDED_PAGE_SERVICE／SUSPENDED_PAGE_PORT 的預設值）。
# 只暴露 8080（說明頁）；健康檢查的 8081 不在 Service 上。
apiVersion: v1
kind: Service
metadata:
  name: paas-suspended-page
  namespace: paas-stg-cloudflare-system
  labels:
    app.kubernetes.io/name: paas-suspended-page
    app.kubernetes.io/part-of: paas-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paas-suspended-page
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
